$engine: 3
$onesync: on
name: Feather
description: The official recipe for Feather Framework.
version: 2.2.3
author: bcc

tasks:
  # Prepare Database
  - action: connect_database

  # Download DB
  - action: download_github
    src: https://github.com/FeatherFramework/feather-recipe
    ref: main
    dest: ./temp/feather-recipe

  # Migrate(Setup) Database Tables
  - action: query_database
    file: ./temp/feather-recipe/database/migration.sql

  # Seed Database
  - action: query_database
    file: ./temp/feather-recipe/database/seed.sql

  # Download default CFX resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources

  # Move the server config over
  - action: move_path
    src: ./temp/feather-recipe/server.cfg
    dest: ./server.cfg

  # Move the server icon over
  - action: move_path
    src: ./temp/feather-recipe/servericon.png
    dest: ./servericon.png

  # Downloading Feather Framework Scripts
  # Load Screen
  - action: download_github
    src: https://github.com/FeatherFramework/feather-loadscreen
    ref: main
    dest: ./resources/[feather]/feather-loadscreen

  # Core
  - action: download_github
    src: https://github.com/FeatherFramework/feather-core
    ref: main
    dest: ./resources/[feather]/feather-core

  # Routing
  - action: download_github
    src: https://github.com/FeatherFramework/feather-routing
    ref: main
    dest: ./resources/[feather]/feather-routing

  # Notify
  - action: download_github
    src: https://github.com/FeatherFramework/feather-notify
    ref: main
    dest: ./resources/[feather]/feather-notify

  # World
  - action: download_github
    src: https://github.com/FeatherFramework/feather-world
    ref: main
    dest: ./resources/[feather]/feather-world

  # PVP
  - action: download_github
    src: https://github.com/FeatherFramework/feather-pvp
    ref: main
    dest: ./resources/[feather]/feather-pvp

  # Settings
  - action: download_github
    src: https://github.com/FeatherFramework/feather-settings
    ref: main
    dest: ./resources/[feather]/feather-settings

  # Toolkit
  - action: download_github
    src: https://github.com/FeatherFramework/feather-toolkit
    ref: main
    dest: ./resources/[feather]/feather-toolkit

  # Versioner
  - action: download_github
    src: https://github.com/FeatherFramework/feather-versioner
    ref: main
    dest: ./resources/[feather]/feather-versioner

  # HUD
  - action: download_file
    path: ./temp/files/feather-hud.zip
    url: https://github.com/FeatherFramework/feather-hud/releases/latest/download/feather-hud.zip

  - action: unzip
    src: ./temp/files/feather-hud.zip
    dest: ./resources/[feather]/feather-hud

  # Menu v2
  - action: download_file
    path: ./temp/files/feather-menu-v2.zip
    url: https://github.com/FeatherFramework/feather-menu-v2/releases/download/v2.0.0-alpha.2/feather-menu-v2.zip

  - action: unzip
    src: ./temp/files/feather-menu-v2.zip
    dest: ./resources/[feather]/feather-menu-v2

  # Menu
  - action: download_file
    path: ./temp/files/feather-menu.zip
    url: https://github.com/FeatherFramework/feather-menu/releases/latest/download/feather-menu.zip

  - action: unzip
    src: ./temp/files/feather-menu.zip
    dest: ./resources/[feather]/feather-menu

  # Character
  - action: download_github
    src: https://github.com/FeatherFramework/feather-character
    ref: main
    dest: ./resources/[feather]/feather-character

  # Roles
  - action: download_github
    src: https://github.com/FeatherFramework/feather-roles
    ref: main
    dest: ./resources/[feather]/feather-roles

  # Weapons
  - action: download_github
    src: https://github.com/FeatherFramework/feather-weapons
    ref: main
    dest: ./resources/[feather]/feather-weapons

  # Inventory
  - action: download_file
    path: ./temp/files/feather-inventory.zip
    url: https://github.com/FeatherFramework/feather-inventory/releases/latest/download/feather-inventory.zip

  - action: unzip
    src: ./temp/files/feather-inventory.zip
    dest: ./resources/[feather]/feather-inventory
    timeoutSeconds: 600

  # Admin
  - action: download_github
    src: https://github.com/FeatherFramework/feather-admin
    ref: main
    dest: ./resources/[feather]/feather-admin

  # Download OxmySQL dependency
  - action: download_file
    path: ./temp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip

  - action: unzip
    src: ./temp/files/oxmysql.zip
    dest: ./resources/[essentials]

  # Download Weathersync dependency
  - action: download_github
    src: https://github.com/kibook/weathersync
    ref: master
    dest: ./resources/[essentials]/weathersync

  # Clean up db files
  - action: remove_path
    path: ./temp
